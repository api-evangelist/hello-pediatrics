aid: hello-pediatrics
name: Hello Pediatrics
description: 'Hello Pediatrics is a virtual pediatric medical practice that partners
  with primary care pediatric offices to cover their patients after hours. Board-certified
  pediatricians deliver telehealth visits — triage, video appointments and real-time
  messaging — on nights, weekends and holidays, and send a visit summary back to the
  child''s regular pediatrician so the medical home keeps the record. The practice
  works with 30+ partner pediatric practices, participates with major insurers (Cigna,
  UnitedHealthcare, Aetna, Anthem, CareFirst), and prices partner coverage at $16 per
  call with a monthly minimum. It is a clinical service organization, not a software
  vendor: patient scheduling and video are delivered on a white-labeled third-party
  telehealth platform (Mend) at book.hellopediatrics.com, and Hello Pediatrics publishes
  no developer program, public API, SDK or machine-readable API contract of any kind.'
